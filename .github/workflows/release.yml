name: Release

# Publishes to npm with provenance attestation when a v* tag is pushed.
# Auth: npm Trusted Publishing via GitHub Actions OIDC — no NPM_TOKEN secret required.
# Configure the trusted publisher on npm at:
#   https://www.npmjs.com/package/n8n-nodes-assemblyai/access

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to a version that supports Trusted Publishing (>=11.5.1)
        # Pin the npm version for build reproducibility. Bump manually when needed.
        # Use --prefix to install into a side directory then promote via PATH —
        # avoids the self-upgrade race where `npm install -g npm@latest` removes
        # its own files mid-install and crashes with MODULE_NOT_FOUND.
        run: |
          npm install --prefix "$HOME/.npm-new" npm@11.5.1
          echo "$HOME/.npm-new/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Show npm version
        run: 'npm --version'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Publish to npm with provenance (Trusted Publishing via OIDC)
        run: 'npm publish --provenance --access public --ignore-scripts'

      - name: Wait for registry propagation
        run: 'sleep 30'

      - name: Verify with n8n community package scanner
        run: 'npx --yes @n8n/scan-community-package@latest n8n-nodes-assemblyai'
